# uv workspace 루트 (패키지 아님). 패키지는 packages/ 아래:
#   packages/evalkit → playground-evalkit (지표 · KorQuAD · 결과 기록, 의존 없음)
#   packages/llm     → playground-llm (Phase 2)
[project]
name = "llm-playground-llm"
version = "0.0.0"
requires-python = ">=3.13"
dependencies = ["playground-evalkit"]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
playground-evalkit = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
