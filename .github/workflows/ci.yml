# 린트 · 테스트. main push 와 PR 에서 돈다
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: |
          uv run ruff check
          uv run ruff format --check
      - name: Pytest
        run: uv run pytest
